# netlify.toml
[build]
  command = "npm run build"
  publish = "build"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[context.production.environment]
  REACT_APP_API_URL = "https://api.datainsightsportal.com/api"

[context.staging.environment]
  REACT_APP_API_URL = "https://api-staging.datainsightsportal.com/api"